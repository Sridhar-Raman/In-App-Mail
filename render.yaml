# Render Blueprint: deploys the API (free plan). The website goes on Vercel; see DEPLOY.md.
services:
  - type: web
    name: sricr-mail-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false        # your Atlas connection string
      - key: MONGODB_DB
        value: sricr_inapp_mail
      - key: CLIENT_ORIGIN
        sync: false        # the Vercel address, e.g. https://sricr-mail.vercel.app (comma-separate more, e.g. ,https://mail.sricr.com)
